<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EL DORSAL · Catálogo interactivo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #0c0c0e;
      color: #f3f2ef;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    #app {
      position: relative;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      background: #0c0c0e;
    }
    #app a { color: inherit; text-decoration: none; }
    
    /* Cabecera */
    .hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid #1e1e24;
    }
    .logo { font-weight: 900; letter-spacing: 3px; font-size: 18px; }
    .logo span { color: #ff5b1a; }
    .nav {
      display: flex;
      gap: 12px;
      font-size: 10px;
      color: #8b8b96;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Hero Banner */
    .hero {
      padding: 32px 20px 20px;
      background: radial-gradient(120% 120% at 0% 0%, #1c1c24 0%, #0c0c0e 55%);
    }
    .hero small {
      color: #ff5b1a;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 10px;
      font-weight: 800;
    }
    .hero h1 {
      font-size: 32px;
      line-height: 1;
      margin: 10px 0;
      font-weight: 900;
      letter-spacing: -1px;
    }
    .hero p { color: #8b8b96; max-width: 440px; font-size: 13px; line-height: 1.5; margin: 0; }

    /* Barra de filtros y búsqueda */
    .bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      padding: 12px 20px;
      border-top: 1px solid #1e1e24;
      border-bottom: 1px solid #1e1e24;
      background: #0f0f12;
    }
    .chip {
      border: 1px solid #26262e;
      background: #16161b;
      color: #9a9aa5;
      padding: 7px 14px;
      border-radius: 99px;
      font-size: 11px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
    }
    .chip.on { background: #ff5b1a; border-color: #ff5b1a; color: #fff; }
    .search {
      background: #16161b;
      border: 1px solid #26262e;
      border-radius: 99px;
      padding: 8px 14px;
      color: #f3f2ef;
      font-size: 12px;
      width: 100%;
      outline: none;
      margin-top: 4px;
    }
    .search:focus { border-color: #ff5b1a; }
    @media(min-width: 640px) {
      .search { width: 200px; margin-top: 0; margin-left: auto; }
      .hero h1 { font-size: 42px; }
    }

    /* Catálogo y rejilla */
    .sec { padding: 24px 20px 8px; }
    .sec h2 { font-size: 20px; font-weight: 900; margin: 0; letter-spacing: -.3px; }
    .sec .sub { color: #7c7c88; font-size: 11px; margin-top: 4px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 14px 20px 24px;
    }
    @media(min-width: 640px) {
      .grid { grid-template-columns: repeat(3, 1fr); gap: 16px; }
    }
    @media(min-width: 900px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
    }

    /* Tarjeta de producto */
    .card {
      background: #131318;
      border: 1px solid #1f1f26;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }
    .card:active { transform: scale(0.98); }
    .ph { aspect-ratio: 1/1; background: #fff; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .ph img { width: 100%; height: 100%; object-fit: contain; }
    .in { padding: 10px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
    .cat { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: #ff5b1a; font-weight: 800; }
    .nm { font-size: 12px; line-height: 1.3; font-weight: 600; color: #e9e8e4; }
    .cta { margin-top: auto; font-size: 10px; color: #7c7c88; padding-top: 4px; }
    .empty { padding: 40px; color: #7c7c88; text-align: center; }
    .foot { padding: 24px 20px; border-top: 1px solid #1e1e24; color: #6f6f7a; font-size: 11px; line-height: 1.6; }

    /* Modal emergente para móvil y PC */
    .ov {
      position: fixed;
      inset: 0;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      display: none;
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .ov.on { display: flex; }
    .modal {
      position: relative;
      width: 100%;
      max-width: 550px;
      max-height: 85vh;
      background: #141419;
      border: 1px solid #2a2a33;
      border-radius: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      -webkit-overflow-scrolling: touch;
    }
    @media(min-width: 600px) {
      .modal { flex-direction: row; max-height: 480px; }
    }
    .modal .big {
      width: 100%;
      height: 220px;
      background: #fff;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    @media(min-width: 600px) {
      .modal .big { width: 240px; height: 100%; }
    }
    .modal .big img { width: 100%; height: 100%; object-fit: contain; }
    .modal .det { padding: 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .modal .x {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      border: 1px solid #33333d;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .modal h3 { font-size: 16px; line-height: 1.2; font-weight: 800; margin: 0; }
    .modal .desc { font-size: 11px; color: #9a9aa5; line-height: 1.4; }
    .modal .specs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .modal .specs span { font-size: 9px; border: 1px solid #2c2c36; color: #a8a8b4; border-radius: 99px; padding: 3px 8px; }
    .modal .pr { margin-top: auto; padding-top: 10px; font-size: 24px; font-weight: 900; color: #ff5b1a; }
    .modal .pr small { font-size: 10px; color: #7c7c88; font-weight: 600; display: block; margin-top: 2px; }
    .modal .buy { margin-top: 10px; display: block; text-align: center; background: #ff5b1a; color: #fff; font-weight: 800; padding: 12px; border-radius: 10px; font-size: 12px; }

const all=[];
TOP.forEach(t=>all.push({n:t[0],usd:t[1],img:IMG+t[2]+Q,u:U+t[3],cat:t[4],sec:'Los más vendidos'}));
STARS.forEach(s=>all.push({n:s[0],usd:s[1],img:IMG+s[2]+Q,u:U+s[3],cat:s[4],sec:'Estrellas del momento'}));
const eur=v=>(v*EUR).toFixed(2).replace('.',',')+' €';

function desc(p){
  const tipo=/Player Version/i.test(p.n)?'Player Version (ajustada)':'Fans (corte clásico)';
  return `Camiseta de fútbol temporada 26/27, versión ${tipo}. Tejido transpirable de secado rápido. Escudo bordado.`;
}

function specs(p){
  return ['Temporada 26/27', /Player Version/i.test(p.n)?'Player':'Fans', 'Tallas S–3XL'];
}

let filter='Todos', q='';
const $=id=>document.getElementById(id);

function card(p,i){
  return `<div class="card" onclick="openModal(${i})">
    <div class="ph"><img loading="lazy" src="${p.img}" alt="${p.n}"></div>
    <div class="in"><div class="cat">${p.cat}</div><div class="nm">${p.n}</div>
    <div class="cta">Ver ficha →</div></div></div>`;
}

function render(){
  const list=all.map((p,i)=>({p,i})).filter(o=>(filter==='Todos'||o.p.cat===filter)&&o.p.n.toLowerCase().includes(q));
  const top=list.filter(o=>o.p.sec==='Los más vendidos');
  const star=list.filter(o=>o.p.sec==='Estrellas del momento');
  const chips=['Todos','Selección','Club','Estrella'].map(c=>`<div class="chip ${filter===c?'on':''}" onclick="setFilter('${c}')">${c}</div>`).join('');
  
  $('app').innerHTML=`
  <div class="hdr"><div class="logo">EL<span>·</span>DORSAL</div>
    <div class="nav"><span>Catálogo (${all.length})</span></div></div>
  <div class="hero"><small>Temporada 26/27</small>
    <h1>El fútbol<br>se viste.</h1>
    <p>Pulsa cualquier prenda para ver detalles y precio.</p></div>
  <div class="bar">${chips}<input class="search" id="s" placeholder="Buscar camiseta..." value="${q}" oninput="onSearch(this.value)"></div>
  ${top.length?`<div class="sec"><h2>Los más vendidos</h2><div class="sub">${top.length} modelos</div></div><div class="grid">${top.map(o=>card(o.p,o.i)).join('')}</div>`:''}
  ${star.length?`<div class="sec"><h2>Estrellas del momento</h2><div class="sub">${star.length} modelos</div></div><div class="grid">${star.map(o=>card(o.p,o.i)).join('')}</div>`:''}
  ${!list.length?`<div class="empty">Sin resultados.</div>`:''}
  <div class="foot"><b>EL DORSAL</b> — Precios orientativos en €.</div>
  <div class="ov" id="ov" onclick="if(event.target.id==='ov')closeModal()"><div class="modal" id="modal"></div></div>`;
}

window.setFilter=function(f){ filter=f; render(); };
window.onSearch=function(val){ q=val.toLowerCase(); render(); const s=$('s'); s.focus(); s.setSelectionRange(s.value.length,s.value.length); };

window.openModal=function(i){
  const p=all[i];
  $('modal').innerHTML=`
    <div class="x" onclick="closeModal()">×</div>
    <div class="big"><img src="${p.img}" alt="${p.n}"></div>
    <div class="det">
      <div class="cat">${p.cat} · ${p.sec}</div>
      <h3>${p.n}</h3>
      <div class="desc">${desc(p)}</div>
      <div class="specs">${specs(p).map(x=>`<span>${x}</span>`).join('')}</div>
      <div class="pr">${eur(p.usd)}<small>Precio orientativo</small></div>
      <a class="buy" href="${p.u}" target="_blank" rel="noopener">Comprar en la tienda →</a>
    </div>`;
  $('ov').classList.add('on');
  document.body.style.overflow = 'hidden';
};

window.closeModal=function(){
  $('ov').classList.remove('on');
  document.body.style.overflow = '';
};

render();
})();
</script>
